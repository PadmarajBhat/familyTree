steps:
  # Build and Push the container image using Kaniko for caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=gcr.io/$PROJECT_ID/gemini-live-backend'
      - '--context=dir://backend'
      - '--cache=true'
      - '--cache-ttl=168h'

  # Deploy container to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gemini-live-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gemini-live-backend'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'

images:
  - 'gcr.io/$PROJECT_ID/gemini-live-backend'

options:
  logging: CLOUD_LOGGING_ONLY
